spring:
  datasource:
    url: ${POSTGRES_URL}

    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      #ddl-auto: update
      ddl-auto: validate
      dialect: org.hibernate.dialect.PostgreSQLDialect  # добавляем явный диалект
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    #2 строки находящиеся нужны в случае если DB уже существует
    #baseline-on-migrate: true
    #baseline-version: 1
    #----------------------------------------------------------#