spring:
  datasource:
    url: ${POSTGRES_URL}

    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    #2 строки находящиеся нужны в случае если DB уже существует
    #baseline-on-migrate: true
    #baseline-version: 1
    #----------------------------------------------------------#
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  #RabbitMq
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

springdoc:
  #Swagger UI
  swagger-ui:
    path: /swagger-ui.html
  #OpenAPI JSON
  api-docs:
    path: /docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: gym

jwt:
  secret: ${JWT_SECRET}
